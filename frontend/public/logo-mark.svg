<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cancharianeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052E0"/>
      <stop offset="100%" stop-color="#0035B8"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22FFA8"/>
      <stop offset="100%" stop-color="#00E575"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#cancharianeBg)"/>
  <rect x="4" y="4" width="504" height="504" rx="120" stroke="white" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Sports Court Outer Frame -->
  <rect x="124" y="112" width="264" height="288" rx="28" fill="rgba(255,255,255,0.06)" stroke="white" stroke-width="14" stroke-linecap="round"/>

  <!-- Net (Center Horizontal Line) -->
  <line x1="124" y1="256" x2="388" y2="256" stroke="white" stroke-width="10" stroke-dasharray="14 10" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Center Longitudinal Service Line -->
  <line x1="256" y1="172" x2="256" y2="340" stroke="white" stroke-width="8" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- Service Boxes Horizontal Lines -->
  <line x1="168" y1="172" x2="344" y2="172" stroke="white" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="168" y1="340" x2="344" y2="340" stroke="white" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Dynamic Energy Ball (Upper Right Edge) -->
  <circle cx="376" cy="136" r="42" fill="url(#ballGlow)"/>
  <circle cx="376" cy="136" r="26" fill="url(#ballGrad)" filter="url(#softGlow)"/>
  <path d="M 364 122 C 374 130 376 142 368 152" stroke="#009650" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
</svg>
