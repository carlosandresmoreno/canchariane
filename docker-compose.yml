services:
  postgres:
    image: postgres:16-alpine
    container_name: canchariane_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: canchariane
      POSTGRES_PASSWORD: canchariane_password
      POSTGRES_DB: canchariane_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchariane -d canchariane_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canchariane_backend
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      DB_HOST: ${DB_HOST:-arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-vlf1v1(3cX9pN|Z.yb350K~MX?Lq}
      DB_NAME: ${DB_NAME:-canchariane_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:vlf1v1%283cX9pN%7CZ.yb350K%7EMX%3FLq@arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com:5432/canchariane_db}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://postgres:vlf1v1%283cX9pN%7CZ.yb350K%7EMX%3FLq@arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com:5432/canchariane_db}
      JWT_SECRET: canchariane_production_super_secret_key_minimum_32_bytes_token
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      DEFAULT_TIMEZONE: America/Bogota
    ports:
      - "8004:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canchariane_frontend
    restart: unless-stopped
    ports:
      - "8005:80"
    depends_on:
      - backend

volumes:
  postgres_data:
