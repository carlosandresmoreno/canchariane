services:
  postgres:
    image: postgres:16-alpine
    container_name: canchariane_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: canchariane
      POSTGRES_PASSWORD: canchariane_password
      POSTGRES_DB: canchariane_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchariane -d canchariane_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canchariane_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://canchariane:canchariane_password@postgres:5432/canchariane_db
      SYNC_DATABASE_URL: postgresql+psycopg://canchariane:canchariane_password@postgres:5432/canchariane_db
      JWT_SECRET: canchariane_production_super_secret_key_minimum_32_bytes_token
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      DEFAULT_TIMEZONE: America/Bogota
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canchariane_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
