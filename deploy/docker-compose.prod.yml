services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: canchariane_prod_backend
    restart: always
    ports:
      - "8004:8000"
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      DEBUG: "false"
      DB_HOST: ${DB_HOST:-arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-vlf1v1(3cX9pN|Z.yb350K~MX?Lq}
      DB_NAME: ${DB_NAME:-canchariane_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:vlf1v1%283cX9pN%7CZ.yb350K%7EMX%3FLq@arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com:5432/canchariane_db}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://postgres:vlf1v1%283cX9pN%7CZ.yb350K%7EMX%3FLq@arianedevs-db.c4xiqgaau7tv.us-east-1.rds.amazonaws.com:5432/canchariane_db}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_super_secret_64_byte_random_string_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      DEFAULT_TIMEZONE: America/Bogota
      HOLD_EXPIRATION_MINUTES: 10
      MIN_LEAD_TIME_MINUTES: 30
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - canchariane_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: canchariane_prod_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8005:80"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - canchariane_network

networks:
  canchariane_network:
    driver: bridge
