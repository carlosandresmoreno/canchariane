databases:
  - name: canchariane-postgres
    databaseName: canchariane_db
    user: canchariane
    plan: starter
    region: ohio
    postgresMajorVersion: 16

services:
  # Backend API
  - type: web
    name: canchariane-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: canchariane-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: DEFAULT_TIMEZONE
        value: America/Bogota
      - key: HOLD_EXPIRATION_MINUTES
        value: 10
      - key: MIN_LEAD_TIME_MINUTES
        value: 30

  # Frontend Web App
  - type: web
    name: canchariane-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    region: ohio
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
