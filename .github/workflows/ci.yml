name: Canchariane v2 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canchariane
          POSTGRES_PASSWORD: canchariane_password
          POSTGRES_DB: canchariane_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL extensions
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U canchariane -d canchariane_db -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          docker exec ${{ job.services.postgres.id }} psql -U canchariane -d canchariane_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        working-directory: ./backend
        run: ruff check .

      - name: Run Mypy Strict on Domain Layer
        working-directory: ./backend
        run: mypy --strict app/domain

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://canchariane:canchariane_password@localhost:5432/canchariane_db
          SYNC_DATABASE_URL: postgresql+psycopg://canchariane:canchariane_password@localhost:5432/canchariane_db
        run: alembic upgrade head

      - name: Run Automated Test Suite (Coverage >= 80% on Domain)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://canchariane:canchariane_password@localhost:5432/canchariane_db
          SYNC_DATABASE_URL: postgresql+psycopg://canchariane:canchariane_password@localhost:5432/canchariane_db
          JWT_SECRET: ci_secret_key_testing_1234567890_32bytes
        run: |
          pytest --cov=app/domain --cov-report=term-missing --cov-fail-under=80 tests/ -v

  frontend-checks:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Run Karma Tests (ChromeHeadless)
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
